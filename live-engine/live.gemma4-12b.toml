# Profil : Gemma 4 12B « Heretic » (Q4_K_M) — 15 Go de VRAM / 64 Go de RAM.
# Usage : cp live.gemma4-12b.toml live.toml
#
# Modèle : https://huggingface.co/igorls/gemma-4-12B-it-heretic-GGUF
#   huggingface-cli download igorls/gemma-4-12B-it-heretic-GGUF --include "*Q4_K_M*" --local-dir models
#
# ⚠ Les chiffres d'architecture ci-dessous n'ont PAS pu être lus sur la fiche du modèle (accès
#   Hugging Face bloqué lors de la préparation) : 48 couches viennent d'un extrait de recherche,
#   n_kv_heads / head_dim sont des estimations PRUDENTES (elles surestiment le cache KV, car Gemma 4
#   utilise une attention à fenêtre glissante). Vérifie-les dans config.json du modèle de base
#   (num_hidden_layers, num_key_value_heads, head_dim) et corrige si besoin.

[server]
bind = "127.0.0.1:3001"
uploads_dir = "../backend/uploads"
frontend_dir = "../frontend/dist"

[hardware]
vram_gb = 15.0
ram_gb = 64.0
vram_reserve_gb = 1.0          # OS + navigateur
vram_other_models_gb = 1.0     # Whisper small sur GPU ; mets 0 s'il tourne sur CPU

[llm]
url = "http://127.0.0.1:8080"
model = "gemma-4-12b-heretic"
model_path = "models/gemma-4-12B-it-heretic-Q4_K_M.gguf"   # ajuste au nom réel du fichier téléchargé
model_size_gb = 7.4            # remplacé par la taille réelle du fichier s'il existe
n_layers = 48
n_kv_heads = 8                 # estimation prudente, à vérifier
head_dim = 256                 # estimation prudente, à vérifier
ctx_tokens = 16384
temperature = 0.9
autostart = false              # passe à true pour que le moteur lance llama-server lui-même
binary = "llama-server"
# Gemma 4 est un modèle « thinking » : on coupe la réflexion pour une conversation vocale.
# (Signalé comme parfois inefficace selon la version de llama.cpp : si des blocs de réflexion
#  apparaissent dans les réponses, mets à jour llama.cpp ou utilise un template jinja dédié.)
extra_args = ["--chat-template-kwargs", "{\"enable_thinking\":false}"]

[stt]
enabled = true
url = "http://127.0.0.1:8081"
language = "fr"

[tts]
enabled = true
url = "http://127.0.0.1:8880"
model = "kokoro"
default_voice = "ff_siwis"
format = "mp3"
